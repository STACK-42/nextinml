name: Pivotal Research AI Safety Fellowship
type: Fellowship
organizer: Pivotal Research
description: >-
  A 15-week, full-time AI safety research fellowship in London. Fellows receive
  expert mentorship, research management, workspace, workshops, and financial
  support. The programme offers a stipend of £15,000–£18,000, travel support,
  and housing support for eligible fellows based outside London.
