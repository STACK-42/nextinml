name: Microsoft Research Fellowship
type: Research Fellowship
organizer: Microsoft Research
description: >-
  Supports academic researchers, including eligible faculty, PhD students,
  and postdoctoral researchers, in advancing open research challenges through
  collaboration with Microsoft Research. Funding varies by region and is
  awarded to the researcher's institution. Collaboration may include workshops,
  working sessions, regular meetings, and research exchanges.
region: Global
format: Hybrid
deadline: null
applicationUrl: https://www.microsoft.com/en-us/research/academic-program/microsoft-research-fellowship/
