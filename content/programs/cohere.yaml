
name: "Cohere Labs Scholars Program"
type: Fellowship
organizer: "Cohere Labs (Cohere For AI)"
description: >-
  A full-time, paid, remote-first research apprenticeship for emerging
  machine learning researchers. Scholars are matched with mentors and lead
  research projects addressing complex ML problems, including language
  models, multilingual AI, model efficiency, and responsible AI. Participants
  receive tailored mentorship from ML researchers and engineers and access
  to large-scale experimental resources. Previous publications or formal
  research experience are not required; strong engineering skills, curiosity,
  creative thinking, and full-time availability are valuable. The official
  page says applications are expected to reopen in Fall 2026, but the program
  is currently marked closed.
region: Global
format: Remote
deadline: "TBA — applications expected to open in Fall 2026"
applicationUrl: "https://cohere.com/research/scholars-program"
status: Closed