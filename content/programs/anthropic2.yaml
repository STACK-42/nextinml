
name: "Anthropic Fellows Program — Reinforcement Learning"
type: Fellowship
organizer: Anthropic
description: >-
  A four-month, full-time research fellowship for technical candidates
  interested in reinforcement learning and empirical AI research. Projects
  may explore RL algorithms, model generalization, training-data quality,
  and the design of environments for improving AI capabilities and safety.
  Fellows receive direct research mentorship, compute and research funding,
  and a weekly stipend. Strong Python skills and experience with software
  engineering, machine learning, or training and evaluating language models
  are useful. Applicants must have full-time work authorization and be
  located in the United States, United Kingdom, or Canada throughout the
  program.
region: Americas
format: Remote
deadline: "Rolling applications — next cohort expected January 2027"
applicationUrl: "https://job-boards.greenhouse.io/anthropic/jobs/5183051008"
status: Open