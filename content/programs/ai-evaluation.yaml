
name: International Programme on AI Evaluation 
type: Fellowship
organizer: International Programme on AI Evaluation
description: >-
  A fully funded international programme designed to develop expertise in
  evaluating the capabilities, risks, and safety of advanced AI systems.
  The five-month programme brings together graduate students, PhD candidates,
  early-career researchers, and professionals from around the world.

  Participants receive structured training in AI evaluation methodologies,
  including benchmarking, red-teaming, interpretability, experimental design,
  AI alignment, and governance. The programme combines lectures, practical
  evaluation activities, mentorship, and an interdisciplinary capstone
  project involving an original AI evaluation study.

  Selected participants receive full tuition coverage through a scholarship
  funded by Coefficient Giving. Graduates earn a 15 ECTS Expert Diploma
  certified by ValgrAI. There is no stipend for living expenses.
  From februaru to june 2027

