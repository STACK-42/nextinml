name: "Anthropic Institute Fellows — Economics & Policy"
type: Fellowship
organizer: Anthropic
description: >-
  A four-month, full-time research fellowship exploring the economic,
  policy, and societal effects of advanced AI. Projects may study AI's
  effects on labor markets and the future of work, AI-enabled cyber and
  biological risks, model performance, and indicators of changes in AI
  research and development. Fellows receive mentorship, compute and research
  funding, and a weekly stipend. Applicants should have strong empirical
  research and Python skills, communicate results clearly, and be interested
  in translating research into policy-relevant findings. Applicants must
  have full-time work authorization and be located in the United States,
  United Kingdom, or Canada during the program.
region: Americas
format: Remote
deadline: "Rolling applications — next cohort expected January 2027"
applicationUrl: "https://job-boards.greenhouse.io/anthropic/jobs/5183053008"
status: open
