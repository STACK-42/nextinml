name: "Anthropic Conceptual Reasoning Fellowship"
type: Fellowship
organizer: Anthropic
description: >-
  A four-month, full-time fellowship for experienced researchers in fields
  such as philosophy, cognitive science, economics, policy, and law.
  Fellows work with Anthropic research teams to evaluate and improve
  Claude's reasoning in areas that require expert judgment. Projects may
  involve designing benchmarks, datasets, evaluations, and reinforcement
  learning environments for complex, judgment-intensive tasks. Applicants
  must hold or be completing a relevant PhD, or have equivalent research
  experience, have hands-on experience using Claude and Claude Code, and
  possess US work authorization. An in-person orientation in San Francisco
  is required, with remote work considered in certain US circumstances.
region: Americas
format: Hybrid
deadline: "2026-10-28"
applicationUrl: "https://job-boards.greenhouse.io/anthropic/jobs/5447080008"
status: open
