name: MIRI Technical Governance Team Research Fellowship
type: Research Fellowship
organizer: Machine Intelligence Research Institute (MIRI), Technical Governance Team
description: >-
  An eight-week research fellowship focused on technical AI governance and
  existential risk. Fellows work independently on scoped research projects
  under the team's guidance. The announced cohort offered a $1,200 weekly
  stipend and a remote-first format with an in-person kickoff in Berkeley,
  California, including flights and housing. Applications for the announced
  cohort are closed.
region: Global
format: Remote with in-person kickoff
deadline: null
applicationUrl: https://techgov.intelligence.org/blog/announcing-miri-technical-governance-team-research-fellowship
