name: "CaCTüS — Computation and Cognition Tübingen Summer Internship"
type: Internship
organizer: Max Planck Institutes for Biological Cybernetics and Intelligent Systems, in collaboration with the Tübingen AI Center
description: >-
  A fully funded, three-month summer research internship for Bachelor’s and
  Master’s students interested in artificial intelligence, machine learning,
  neuroscience, cognition, and related fields. Interns work on supervised
  research projects involving areas such as computer science, theoretical
  neuroscience, electrical engineering, behavioral science, and data analysis.
  The program offers a monthly salary of approximately €1,350, accommodation,
  health insurance, and compensation for travel expenses. It particularly
  encourages applications from students whose educational and research
  opportunities are constrained by personal, financial, regional, or societal
  circumstances, including students living in underrepresented low- and
  middle-income countries. Applicants must have a strong academic record,
  relevant research interests, good English proficiency, and availability for
  the full internship period. Applicants must not have started a PhD before
  the internship. The 2027 internship runs from July 1 to September 30, 2027.
region: Europe
format: In-person
deadline: "2026-11-16"
applicationUrl: https://www.projects.tuebingen.mpg.de/apply
