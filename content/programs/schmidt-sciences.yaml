name: AI Institute Fellow in Residence
type: Fellowship
organizer: Schmidt Sciences
description: >-
  A 12–18 month fellowship for recent PhD graduates in AI and computer science.
  Fellows pursue research aligned with the AI Institute's priorities while
  helping develop research initiatives, grantmaking programs, workshops, and
  open-source projects. Research areas include AI for scientific discovery,
  multi-agent systems, trustworthy AI, alignment, and AI's labor-market impact.
