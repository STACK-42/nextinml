name: MARS Programme
type: Research Mentorship Programme
organizer: Cambridge AI Safety Hub (CAISH)
description: >-
  A part-time AI safety research programme pairing teams of 2–4 early-career
  researchers with experienced mentors to produce research outputs. Topics
  include AI control, interpretability, evaluations, robustness, scalable
  oversight, AI governance, and policy. The programme provides research
  management, compute resources, and support for an in-person kickoff.
region: Global
format: Hybrid
deadline: null
applicationUrl: https://caish.org/mars
