name: CBAI AI Safety Research Fellowship
type: Fellowship
organizer: Cambridge Boston Alignment Initiative (CBAI)
description: >-
  A fully funded, ten-week research program supporting researchers interested
  in technical AI safety and governance. Research areas include interpretability,
  multi-agent safety, formal verification, and risk-management frameworks.
  Fellows receive mentorship, research management, workshops, and networking
  opportunities in the Cambridge, Massachusetts AI safety community.
region: Americas
format: In-person
deadline: 2026-09-06
applicationUrl: https://www.cbai.ai/ais-research-fellowship
